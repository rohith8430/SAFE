services:
  - type: web
    name: safespot-community-map
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: DATA_DIR
        value: /tmp/safespot
      - key: UPLOAD_FOLDER
        value: /tmp/safespot/uploads
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false

